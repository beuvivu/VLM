name: CI

on:
  push:
    branches: ["main", "master"]
    paths-ignore:
      - "data/forecast/ledger.jsonl"
      - "data/forecast/ml-ledger.jsonl"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cài gói và công cụ phát triển
        run: python -m pip install -e ".[dev,crawler]"
      - name: Ruff (lỗi đúng/sai)
        run: ruff check --select F,B023 src scripts tests
      - name: Pytest
        run: python -m pytest -q

  ml:
    name: Optional ML backends (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,ml]"
      - run: python -m pytest tests/test_vlm_forecast_models.py tests/test_vlm_forecast_pipeline.py -q
