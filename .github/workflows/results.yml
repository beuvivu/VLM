name: Tự cập nhật kết quả từng sản phẩm

# GitHub cron uses UTC: 23:00–15:50 UTC = 06:00–22:50 Vietnam time.
# This is recovery at ten-minute intervals, not a realtime SLA. The API's
# persistent updater polls live windows every two minutes.
on:
  schedule:
    - cron: "*/10 23,0-15 * * *"
    - cron: "17 16-22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/results.yml
      - src/vlm/updates/**
      - src/vlm/forecast/**

permissions:
  contents: write

concurrency:
  group: vietlott-update
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VQE_SOURCE: auto
      VQE_HTTP_BACKEND: curl_cffi
      VQE_SEED_FILE_DIR: data/seed
      VQE_AUTO_UPDATE_DIR: data/results
      VQE_LOG_LEVEL: WARNING
      PYTHONUTF8: "1"
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cài crawler
        run: python -m pip install -e ".[crawler]"
      - name: Khôi phục trạng thái
        uses: actions/cache/restore@v6
        with:
          path: |
            data/vietlott.duckdb*
            data/parquet
            data/products
            data/forecast/*.json
            data/forecast/ml/*.json.gz
            data/results/status.json
          key: vqe-state-${{ github.run_id }}
          restore-keys: vqe-state-
      - name: Cập nhật các sản phẩm đến hạn
        id: update
        continue-on-error: true
        run: vlm-update --once > results-status.json
      - name: Giữ kết quả đã xác thực trong repo
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- data/results/results.jsonl data/forecast/ml-ledger.jsonl)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/results/results.jsonl
            if [ -f data/forecast/ml-ledger.jsonl ]; then git add data/forecast/ml-ledger.jsonl; fi
            git commit -m "data: kết quả Vietlott $(date +%F' '%H:%M) [skip ci]"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash && git push; then ok=1; break; fi
              sleep 5
            done
            [ "$ok" = 1 ] || { echo "::error::Không đẩy được journal kết quả"; exit 1; }
          fi
      - name: Lưu trạng thái
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            data/vietlott.duckdb*
            data/parquet
            data/products
            data/forecast/*.json
            data/forecast/ml/*.json.gz
            data/results/status.json
          key: vqe-state-${{ github.run_id }}
      - name: Báo cáo cập nhật
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vietlott-results-status
          path: |
            results-status.json
            data/results/status.json
          retention-days: 14
      - name: Báo lỗi nguồn hoặc worker
        if: steps.update.outcome == 'failure'
        run: |
          echo "::error::Có sản phẩm chưa đồng bộ được; xem status. Kết quả đã lưu được giữ, kỳ còn thiếu sẽ được thử lại."
          exit 1
