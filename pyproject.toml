[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vietlott-quant-engine"
dynamic = ["version"]
description = "Vietlott Quant Engine: dữ liệu, xác suất chính xác, kiểm định ngẫu nhiên, EV, chơi bao và dự báo tự học có kiểm chứng cho 8 sản phẩm Vietlott"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "beuvivu" }]
keywords = ["vietlott", "lottery", "statistics", "e-value", "probability"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Natural Language :: Vietnamese",
]
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3",
  "httpx[socks]>=0.27",
  "sqlalchemy>=2.0,<3",
  "beautifulsoup4>=4.12",
  "duckdb>=1.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6", "mypy>=1.11", "pyyaml>=6"]
crawler = ["curl_cffi>=0.13,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]
ml = ["xgboost>=2.0,<4", "lightgbm>=4.0,<5"]

[project.scripts]
vietlott = "vietlott_engine.cli:main"
vlm-audit = "vlm.tools.gap_analyzer:main"
vlm-update = "vlm.updates.cli:main"
vlm-forecast = "vlm.forecast.cli:main"

[project.urls]
Homepage = "https://github.com/beuvivu/vietlott-quant-engine"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "vietlott_engine.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: statistical recovery tests (a few seconds each)"]

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
# What CI enforces: real errors (undefined names, unused imports, late-binding closures).
# Style rules (E, I, UP, ...) are not enforced; the maths code uses long lines and X, W1, ... names.
select = ["F", "B023"]

[tool.ruff.lint.isort]
known-first-party = ["vietlott_engine"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
mypy_path = "src"
